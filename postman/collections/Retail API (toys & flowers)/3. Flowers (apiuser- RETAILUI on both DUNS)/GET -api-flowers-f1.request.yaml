$kind: http-request
name: GET /api/flowers/f1
url: "{{baseUrl}}/api/flowers/f1"
method: GET
headers:
  Authorization: Bearer {{access_apiuser}}
  X-ID-Token: "{{id_apiuser}}"
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 Red Roses', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().name).to.eql('Red Roses (dozen)');
      });
    language: text/javascript
order: 2000
