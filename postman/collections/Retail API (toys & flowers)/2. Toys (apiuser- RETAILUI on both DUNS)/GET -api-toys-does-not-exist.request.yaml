$kind: http-request
name: GET /api/toys/does-not-exist
url: "{{baseUrl}}/api/toys/does-not-exist"
method: GET
headers:
  Authorization: Bearer {{access_apiuser}}
  X-ID-Token: "{{id_apiuser}}"
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 not_found', function () {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().error).to.eql('not_found');
      });
    language: text/javascript
order: 3000
