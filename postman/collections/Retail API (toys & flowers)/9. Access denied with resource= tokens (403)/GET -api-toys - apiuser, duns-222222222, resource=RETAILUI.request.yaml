$kind: http-request
name: "GET /api/toys | apiuser, duns-222222222, resource=RETAILUI"
description: "RETAILUI of DUNS 222222222 does not open the toys (owned by DUNS 111111111)"
url: "{{baseUrl}}/api/toys"
method: GET
headers:
  Authorization: "Bearer {{access_a_222_RETAILUI}}"
  X-ID-Token: "{{id_a_222_RETAILUI}}"
  Accept: "application/json"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 403', function () { pm.response.to.have.status(403); });
      pm.test('Body is a JSON access_denied error', function () {
        const b = pm.response.json();
        pm.expect(b.error).to.eql('access_denied');
        pm.expect(b.status).to.eql(403);
        pm.expect(b.message).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 7000
