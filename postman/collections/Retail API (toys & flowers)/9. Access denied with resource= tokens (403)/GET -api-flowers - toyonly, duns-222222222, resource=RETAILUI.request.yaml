$kind: http-request
name: "GET /api/flowers | toyonly, duns-222222222, resource=RETAILUI"
description: "toyonly has no RETAILUI under DUNS 222222222 -> flowers denied"
url: "{{baseUrl}}/api/flowers"
method: GET
headers:
  Authorization: "Bearer {{access_t_222_RETAILUI}}"
  X-ID-Token: "{{id_t_222_RETAILUI}}"
  Accept: "application/json"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 403', function () { pm.response.to.have.status(403); });
      pm.test('Body is a JSON access_denied error', function () {
        const b = pm.response.json();
        pm.expect(b.error).to.eql('access_denied');
        pm.expect(b.status).to.eql(403);
        pm.expect(b.message).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 8000
