$kind: http-request
name: "GET /api/me | duns-111111111, resource=RETAILUI"
description: "Identity echo: exactly one DUNS and one role, although apiuser holds USA, RETAILUI, CRM there"
url: "{{baseUrl}}/api/me"
method: GET
headers:
  Authorization: "Bearer {{access_a_111_RETAILUI}}"
  X-ID-Token: "{{id_a_111_RETAILUI}}"
  Accept: "application/json"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Exactly RETAILUI of DUNS 111111111', function () { pm.expect(pm.response.json().dunsRoles).to.eql({'111111111': ['RETAILUI']}); });
    language: text/javascript
order: 4000
