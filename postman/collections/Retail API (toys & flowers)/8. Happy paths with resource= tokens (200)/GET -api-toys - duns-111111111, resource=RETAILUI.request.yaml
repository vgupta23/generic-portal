$kind: http-request
name: "GET /api/toys | duns-111111111, resource=RETAILUI"
description: "One scope for DUNS 111111111, resource=RETAILUI -> toys readable"
url: "{{baseUrl}}/api/toys"
method: GET
headers:
  Authorization: "Bearer {{access_a_111_RETAILUI}}"
  X-ID-Token: "{{id_a_111_RETAILUI}}"
  Accept: "application/json"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Toy catalog of DUNS 111111111', function () { pm.expect(pm.response.json().duns).to.eql('111111111'); });
    language: text/javascript
order: 1000
