$kind: http-request
name: "GET /api/me | client retail-duns-222222222 | scope 222222222:RETAILUI"
description: "client retail-duns-222222222 | scope 222222222:RETAILUI (user apiuser) -> /api/me"
url: "{{baseUrl}}/api/me"
method: GET
headers:
  Authorization: "Bearer {{access_apiuser_222222222_RETAILUI}}"
  X-ID-Token: "{{id_apiuser_222222222_RETAILUI}}"
  Accept: "application/json"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Token identity: client retail-duns-222222222, duns 222222222', function () {
        const b = pm.response.json();
        pm.expect(b.clientId).to.eql('retail-duns-222222222');
        pm.expect(b.duns).to.eql('222222222');
        pm.expect(b.dunsRoles['222222222']).to.eql(['RETAILUI']);
        pm.expect(b.dunsRoles['111111111']).to.be.undefined;
        pm.expect(b.scope).to.include('222222222:RETAILUI');
      });
    language: text/javascript
order: 2000
