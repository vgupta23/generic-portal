$kind: http-request
name: "GET /api/flowers | client retail-duns-222222222 | scope 222222222:RETAILUI"
description: "client retail-duns-222222222 | scope 222222222:RETAILUI (user noretail) -> /api/flowers"
url: "{{baseUrl}}/api/flowers"
method: GET
headers:
  Authorization: "Bearer {{access_noretail_222222222_RETAILUI}}"
  X-ID-Token: "{{id_noretail_222222222_RETAILUI}}"
  Accept: "application/json"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 403', function () { pm.response.to.have.status(403); });
      pm.test('Denied because: noretail has no RETAILUI on DUNS 222222222', function () { pm.expect(pm.response.json().message).to.include('RETAILUI'); });pm.test('Body is a JSON access_denied error', function () {
        const b = pm.response.json();
        pm.expect(b.error).to.eql('access_denied');
        pm.expect(b.status).to.eql(403);
        pm.expect(b.message).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 7000
