$kind: http-request
name: "GET /api/flowers | client retail-duns-111111111 | scope 111111111:RETAILUI"
description: "client retail-duns-111111111 | scope 111111111:RETAILUI (user apiuser) -> /api/flowers"
url: "{{baseUrl}}/api/flowers"
method: GET
headers:
  Authorization: "Bearer {{access_apiuser_111111111_RETAILUI}}"
  X-ID-Token: "{{id_apiuser_111111111_RETAILUI}}"
  Accept: "application/json"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 403', function () { pm.response.to.have.status(403); });
      pm.test('Denied because: token is for DUNS 111111111; flowers are owned by DUNS 222222222', function () { pm.expect(pm.response.json().message).to.include('RETAILUI'); });pm.test('Body is a JSON access_denied error', function () {
        const b = pm.response.json();
        pm.expect(b.error).to.eql('access_denied');
        pm.expect(b.status).to.eql(403);
        pm.expect(b.message).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 1000
