$kind: http-request
name: "GET /api/toys | client retail-duns-111111111 | scope 111111111:CRM"
description: "client retail-duns-111111111 | scope 111111111:CRM (user apiuser) -> /api/toys"
url: "{{baseUrl}}/api/toys"
method: GET
headers:
  Authorization: "Bearer {{access_apiuser_111111111_CRM}}"
  X-ID-Token: "{{id_apiuser_111111111_CRM}}"
  Accept: "application/json"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 403', function () { pm.response.to.have.status(403); });
      pm.test('Denied because: scope 111111111:CRM puts only CRM in the token, not RETAILUI', function () { pm.expect(pm.response.json().message).to.include('RETAILUI'); });pm.test('Body is a JSON access_denied error', function () {
        const b = pm.response.json();
        pm.expect(b.error).to.eql('access_denied');
        pm.expect(b.status).to.eql(403);
        pm.expect(b.message).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 3000
