$kind: http-request
url: "{{baseUrl}}/api/toys"
method: GET
headers:
  Authorization: Bearer {{access_apiuser}}
  X-ID-Token: "{{id_noretail}}"
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 401', function () { pm.response.to.have.status(401); });
      pm.test('Body is a JSON access_denied error', function () {
        const b = pm.response.json();
        pm.expect(b.error).to.eql('access_denied');
        pm.expect(b.status).to.eql(401);
        pm.expect(b.message).to.be.a('string').and.not.empty;
        pm.expect(b.message).to.include('same user');
      });
    language: text/javascript
order: 7000
