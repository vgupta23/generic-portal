$kind: http-request
name: GET /api/me
url: "{{baseUrl}}/api/me"
method: GET
headers:
  Authorization: Bearer {{access_apiuser}}
  X-ID-Token: "{{id_apiuser}}"
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Custom claims are read from the verified tokens', function () {
        pm.response.to.have.status(200);
        const b = pm.response.json();
        pm.expect(b.username).to.eql('apiuser');
        pm.expect(b.department).to.eql('QA');
        pm.expect(b.dunsRoles['111111111']).to.include('RETAILUI');
        pm.expect(b.dunsRoles['222222222']).to.include('RETAILUI');
        pm.expect(b.accessTokenAudience).to.include('retail-ui');
        pm.expect(b.idTokenAudience).to.include('retail-api-test');
      });
    language: text/javascript
order: 1000
