$kind: http-request
name: "toyonly: toys (RETAILUI on 111111111) is allowed"
url: "{{baseUrl}}/api/toys"
method: GET
headers:
  Authorization: Bearer {{access_toyonly}}
  X-ID-Token: "{{id_toyonly}}"
  Accept: application/json
scripts:
  - type: afterResponse
    code: pm.test('200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
