<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo Portal</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; color: #222; }
  button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
  pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  #landing { display: none; }
</style>
</head>
<body>
<p id="status">Checking authentication…</p>

<div id="landing">
  <h1>Welcome, <span id="name"></span>!</h1>
  <p>You are signed in via Keycloak (OIDC, Authorization Code + PKCE).</p>
  <h3>Custom claims</h3>
  <table id="custom" border="1" cellpadding="6" style="border-collapse:collapse"></table>
  <h3>ID token claims</h3>
  <pre id="claims"></pre>
  <h3>Access token (expires <span id="exp"></span>)</h3>
  <pre id="token"></pre>
  <button id="logout">Log out</button>
</div>

<script>
const CFG = {
  issuer: 'http://localhost:8080/realms/demo',
  clientId: 'demo-ui',
  redirectUri: window.location.origin + '/',
};

const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const rand = () => b64url(crypto.getRandomValues(new Uint8Array(32)));
const decode = jwt => JSON.parse(atob(jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));

async function login() {
  const verifier = rand(), state = rand(), nonce = rand();
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  sessionStorage.setItem('pkce', JSON.stringify({ verifier, state, nonce }));
  const p = new URLSearchParams({
    client_id: CFG.clientId, redirect_uri: CFG.redirectUri, response_type: 'code',
    scope: 'openid profile email', state, nonce,
    code_challenge: challenge, code_challenge_method: 'S256',
  });
  location.href = `${CFG.issuer}/protocol/openid-connect/auth?${p}`;
}

async function exchange(code, returnedState) {
  const saved = JSON.parse(sessionStorage.getItem('pkce') || '{}');
  sessionStorage.removeItem('pkce');
  if (!saved.state || saved.state !== returnedState) throw new Error('State mismatch');
  const res = await fetch(`${CFG.issuer}/protocol/openid-connect/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'authorization_code', client_id: CFG.clientId, code,
      redirect_uri: CFG.redirectUri, code_verifier: saved.verifier,
    }),
  });
  if (!res.ok) throw new Error('Token request failed: ' + await res.text());
  const tokens = await res.json();
  if (decode(tokens.id_token).nonce !== saved.nonce) throw new Error('Nonce mismatch');
  sessionStorage.setItem('tokens', JSON.stringify(tokens));
  return tokens;
}

function show(tokens) {
  const id = decode(tokens.id_token), acc = decode(tokens.access_token);
  document.getElementById('status').style.display = 'none';
  document.getElementById('name').textContent = id.name || id.preferred_username;
  const tbl = document.getElementById('custom');
  for (const k of ['department', 'employee_id', 'roles', 'acr', 'amr'])
    tbl.insertAdjacentHTML('beforeend', `<tr><th>${k}</th><td>${JSON.stringify(id[k] ?? acc[k] ?? null)}</td></tr>`);
  document.getElementById('claims').textContent = JSON.stringify(id, null, 2);
  document.getElementById('token').textContent = tokens.access_token;
  document.getElementById('exp').textContent = new Date(acc.exp * 1000).toLocaleTimeString();
  document.getElementById('landing').style.display = 'block';
  document.getElementById('logout').onclick = () => {
    sessionStorage.removeItem('tokens');
    const p = new URLSearchParams({ id_token_hint: tokens.id_token, post_logout_redirect_uri: CFG.redirectUri });
    location.href = `${CFG.issuer}/protocol/openid-connect/logout?${p}`;
  };
}

(async () => {
  try {
    const q = new URLSearchParams(location.search);
    if (q.get('error')) throw new Error(q.get('error_description') || q.get('error'));
    if (q.has('code')) {
      const tokens = await exchange(q.get('code'), q.get('state'));
      history.replaceState({}, '', CFG.redirectUri);
      return show(tokens);
    }
    const stored = JSON.parse(sessionStorage.getItem('tokens') || 'null');
    if (stored && decode(stored.access_token).exp * 1000 > Date.now()) return show(stored);
    sessionStorage.removeItem('tokens');
    await login();
  } catch (e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
  }
})();
</script>
</body>
</html>
